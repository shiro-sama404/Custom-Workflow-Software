    <div class="container-view">
        
        <div th:replace="~{navMenu :: menu(currentPage='previa')}"></div>

        <header>
            <section id="search-section">

                <div id="search-area">
                    <input type="text" name="escala-search" placeholder="Busque por Escalas..." id="escala-search">
                    <div class="search-area-btn" id="search-btn">
                        <svg>
                            <use xlink:href="#icon-search"></use>
                        </svg>
                    </div>
                    <div class="search-area-btn" id="open-filter-btn">
                        <svg>
                            <use xlink:href="#icon-sliders"></use>
                        </svg>
                    </div>
                </div>
                    
                <div id="user-img-container">
                    <img src="img/user-icon-2.jpg" alt="user-icon" width="50px">
                </div>

            </section>

            <section id="filter-section">

                <div id="filter-menu">
                    <input type="text" name="org-filter"      placeholder="Filtre por Organizações..." id="org-filter">
                    <input type="text" name="military-filter" placeholder="Filtre por Militar..."      id="military-filter">
                    <input type="text" name="group-filter"    placeholder="Filtre por Grupos..."       id="group-filter">
    
                    <button class="filter-btn">Filtrar</button>
                </div>
                <div id="filtered">
                    <div class="filter"></div>
                </div>
            </section>
        </header>

        <section id="preview-container">
            
            <div id="preview-menu">
                <div id="pdf-btn">
                    <svg>
                        <use xlink:href="#icon-filetype-pdf"></use>
                    </svg>
                </div>
                <div class="month-btn" id="prev-btn">
                    <svg>
                        <use xlink:href="#icon-caret-down-fill"></use>
                    </svg>
                </div>
                
                <h1 th:text="${month}" id="month-name"></h1>

                <div class="month-btn" id="next-btn">
                    <svg>
                        <use xlink:href="#icon-caret-up-fill"></use>
                    </svg>
                </div>
                <div id="toggle-view-btn">
                    <svg>
                        <use xlink:href="#icon-table"></use>
                    </svg>
                    <svg>
                        <use xlink:href="#icon-calendar"></use>
                    </svg>
                </div>
            </div>

            <div id="table-container"></table></div>
        </section>
    </div>
    <script src="/js/themeControl.js"></script>
    <script src="/js/enableFilter.js"></script>
    <script type="module" src="/js/previa/previewRender.js"></script>
</body>
</html>
