<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <title>Workflow</title>
    <link rel="icon" href="/img/Logo.svg">

    <script src="https://unpkg.com/htmx.org@2.0.3"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <svg style="display: none;">
       <!-- Ícone House Door Fill -->
        <symbol id="icon-house-door-fill" viewBox="0 0 16 16">
            <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
        </symbol>

        <!-- Ícone Envelope -->
        <symbol id="icon-envelope" viewBox="0 0 16 16">
            <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z"/>
        </symbol>

        <!-- Ícone Person Fill -->
        <symbol id="icon-person-fill" viewBox="0 0 16 16">
            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
        </symbol>

        <!-- Ícone Eye Fill -->
        <symbol id="icon-eye-fill" viewBox="0 0 16 16">
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
        </symbol>

        <!-- Ícone Eye Slash Fill -->
        <symbol id="icon-eye-slash-fill" viewBox="0 0 16 16">
            <path d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z"/>
            <path d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z"/>
        </symbol>
    </svg>

    <div class="container-view">

        <div class="announce"><a href="#"></a></div>
        <div class="announce"><a href="#"></a></div>
        <div class="announce"><a href="#"></a></div>
        <div class="announce"><a href="#"></a></div>
        <div class="announce"><a href="#"></a></div>
        <div class="announce"><a href="#"></a></div>
        <div class="announce">
            <svg>
                <use xlink:href="#icon-house-door-fill"></use>
            </svg>
        </div>

        <section id="login-section">
            <ul>
                <li>
                    <img src="/img/Logo.svg" alt="Logo" id="logo">
                    <h1>Login</h1>
                </li>
                <li>
                    <div class="input-field">
                        <input type="text" name="username" placeholder="usuário" id="user-id">
                        <div class="field-toggle" id="login-option">
                            <svg id="username">
                                <use xlink:href="#icon-person-fill"></use>
                            </svg>
                            <svg id="email">
                                <use xlink:href="#icon-envelope"></use>
                            </svg>
                        </div>
                    </div>
                    <div class="input-field">
                        <input type="text" name="password" placeholder="senha" id="password">
                        <div class="field-toggle" id="password-option">
                            <svg id="hide-password">
                                <use xlink:href="#icon-eye-slash-fill"></use>
                            </svg>
                            <svg id="show-password">
                                <use xlink:href="#icon-eye-fill"></use>
                            </svg>
                        </div>
                    </div>
                    <p>Esqueci minha <a href="#">senha</a>.</p>
                </li>
                <li>
                    <button type="button" id="login-btn">Entrar</button>
                </li>
            </ul>
        </section>

    </div>
    
    <script src="/js/login.js"></script>
</body>
</html>
